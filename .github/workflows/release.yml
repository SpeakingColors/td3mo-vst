name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0 (empty: only build)'
        required: false
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install reportlab
      - name: Build
        env:
          TAGIN: ${{ github.event.inputs.tag }}
        run: |
          tag="${TAGIN:-$GITHUB_REF_NAME}"; [ "$GITHUB_REF_TYPE" = "tag" ] || tag="${TAGIN:-dev}"
          d="out/TD3MO-$tag"; mkdir -p "$d"
          cp docs/recipe-book.html "$d/TD3MO-RecipeBook.html"
          python3 tools/make_manual.py x docs/manual.txt "$d/TD3MO-manual.pdf"
          cp LICENSE packaging/INSTALL.txt "$d/"
          (cd "$d" && find . -type f | sort | xargs sha256sum > SHA256SUMS)
          (cd out && zip -r "TD3MO-$tag.zip" "TD3MO-$tag")
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with: { name: release-zip, path: "out/*.zip" }
      - name: Publish pre-release
        if: github.ref_type == 'tag' || github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="out/TD3MO-$TAG.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" "$f" --clobber
          else gh release create "$TAG" "$f" --target "$GITHUB_SHA" --prerelease --title "TD-3-MO recipe book $TAG" --notes "Offline recipe book for the Behringer TD-3-MO (plus TD-3, Pro-1 and CAT panels): unzip and open TD3MO-RecipeBook.html. Includes the manual. Works offline, collects nothing."; fi
